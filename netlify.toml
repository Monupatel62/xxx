[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline"

# SPA fallback — all routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers on all responses ─────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=3600, must-revalidate"

# ── Hashed JS/CSS assets — cache 1 year (Vite adds content hash) ──────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Static pages ──────────────────────────────────────────────────────────────
[[headers]]
  for = "/about.html"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/privacy.html"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/terms.html"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── PWA manifest ──────────────────────────────────────────────────────────────
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# ── SEO files ─────────────────────────────────────────────────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Icons ─────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
