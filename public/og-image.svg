<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Falling coins (decorative) -->
  <circle cx="130" cy="100" r="28" fill="#facc15" opacity="0.9"/>
  <circle cx="130" cy="100" r="28" fill="none" stroke="#a16207" stroke-width="4"/>
  <text x="130" y="109" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#a16207">$</text>

  <circle cx="310" cy="210" r="22" fill="#facc15" opacity="0.7"/>
  <circle cx="310" cy="210" r="22" fill="none" stroke="#a16207" stroke-width="3"/>
  <text x="310" y="218" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#a16207">$</text>

  <circle cx="520" cy="80" r="18" fill="#facc15" opacity="0.6"/>
  <circle cx="520" cy="80" r="18" fill="none" stroke="#a16207" stroke-width="2.5"/>
  <text x="520" y="87" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#a16207">$</text>

  <circle cx="900" cy="130" r="26" fill="#facc15" opacity="0.85"/>
  <circle cx="900" cy="130" r="26" fill="none" stroke="#a16207" stroke-width="4"/>
  <text x="900" y="139" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#a16207">$</text>

  <circle cx="1070" cy="70" r="20" fill="#facc15" opacity="0.65"/>
  <circle cx="1070" cy="70" r="20" fill="none" stroke="#a16207" stroke-width="3"/>
  <text x="1070" y="78" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#a16207">$</text>

  <circle cx="720" cy="170" r="16" fill="#facc15" opacity="0.55"/>
  <circle cx="720" cy="170" r="16" fill="none" stroke="#a16207" stroke-width="2"/>
  <text x="720" y="177" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#a16207">$</text>

  <!-- Basket (player) -->
  <rect x="510" y="480" width="180" height="38" rx="6" fill="#4ade80"/>
  <rect x="522" y="462" width="156" height="18" rx="4" fill="#22c55e"/>

  <!-- Particle sparkles around last caught coin -->
  <circle cx="600" cy="420" r="6" fill="#facc15" opacity="0.9"/>
  <circle cx="572" cy="400" r="4" fill="#facc15" opacity="0.7"/>
  <circle cx="628" cy="400" r="4" fill="#facc15" opacity="0.7"/>
  <circle cx="558" cy="430" r="3" fill="#facc15" opacity="0.5"/>
  <circle cx="642" cy="430" r="3" fill="#facc15" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="88" font-weight="bold" text-anchor="middle" fill="#4ade80">Catch the Coin</text>

  <!-- Tagline -->
  <text x="600" y="345" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#ffffff" opacity="0.75">Free browser arcade game — no download required</text>

  <!-- HUD chips -->
  <rect x="160" y="370" width="160" height="44" rx="8" fill="#ffffff" fill-opacity="0.07"/>
  <text x="240" y="397" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffd93d">⏱ 60 sec</text>

  <rect x="520" y="370" width="160" height="44" rx="8" fill="#ffffff" fill-opacity="0.07"/>
  <text x="600" y="397" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#88d0ff">3 Stages</text>

  <rect x="880" y="370" width="160" height="44" rx="8" fill="#ffffff" fill-opacity="0.07"/>
  <text x="960" y="397" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ff6b6b">♥ ♥ ♥ Lives</text>

  <!-- URL badge -->
  <rect x="430" y="565" width="340" height="40" rx="20" fill="#4ade80" fill-opacity="0.15"/>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#4ade80">xxx-g.netlify.app</text>
</svg>
